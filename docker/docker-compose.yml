services:
  postgres-master:
    image: bitnami/postgresql:latest
    container_name: postgres-master
    restart: unless-stopped
    environment:
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: ${REPLICATOR_USER:-replicator}
      POSTGRESQL_REPLICATION_PASSWORD: ${REPLICATOR_PASSWORD:-troque_por_senha_forte_replicator}
      POSTGRESQL_USERNAME: ${POSTGRES_USER:-user}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-troque_por_senha_forte}
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-app}
    volumes:
      - ./master_data:/bitnami/postgresql
      - ./master/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres-slave:
    image: bitnami/postgresql:latest
    container_name: postgres-slave
    restart: unless-stopped
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_REPLICATION_USER: ${REPLICATOR_USER:-replicator}
      POSTGRESQL_REPLICATION_PASSWORD: ${REPLICATOR_PASSWORD:-troque_por_senha_forte_replicator}
      POSTGRESQL_MASTER_HOST: postgres-master
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-troque_por_senha_forte}
    volumes:
      - ./slave_data:/bitnami/postgresql
    ports:
      - "5433:5432"
    depends_on:
      postgres-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  traefik:
    image: traefik:v2.10
    container_name: traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  api:
    build:
      context: ../backend
      target: development
    container_name: api
    restart: unless-stopped
    depends_on:
      postgres-master:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${API_HOST:-localhost}`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=3333"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-troque_por_senha_forte}@postgres-master:5432/${POSTGRES_DB:-app}"
      NODE_ENV: development
      PORT: 3333
    expose:
      - "3333"
    ports:
      - "3334:3333"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
